name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and SDL
        run: make deps
      - name: Build the ipk
        run: make ipk REPO=https://github.com/${{ github.repository }}
      # Neither draft nor prerelease: `releases/latest/download/...` in the channel entry must see it
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.ipk build/*.manifest.json --generate-notes
